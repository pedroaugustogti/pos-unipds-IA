<main class="cfp-page">
  <h1>Call for Papers</h1>
  <p>Envie sua proposta de palestra para o evento.</p>

  <form class="cfp-form" (submit)="$event.preventDefault(); onSubmit()" novalidate>
    <div class="field">
      <label for="speaker-name">Nome completo</label>
      <input
        id="speaker-name"
        name="name"
        type="text"
        [value]="form().name"
        (input)="updateField('name', $any($event.target).value)"
        aria-required="true"
        [attr.aria-invalid]="form().name.trim().length === 0 ? 'true' : null"
        autocomplete="name"
      />
    </div>

    <div class="field">
      <label for="speaker-email">E-mail</label>
      <input
        id="speaker-email"
        name="email"
        type="email"
        [value]="form().email"
        (input)="updateField('email', $any($event.target).value)"
        aria-required="true"
        [attr.aria-invalid]="
          form().email.trim().length > 0 &&
          !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form().email.trim())
            ? 'true'
            : null
        "
        autocomplete="email"
      />
    </div>

    <div class="field">
      <label for="talk-title">Título da palestra</label>
      <input
        id="talk-title"
        name="talkTitle"
        type="text"
        [value]="form().talkTitle"
        (input)="updateField('talkTitle', $any($event.target).value)"
        aria-required="true"
        [attr.aria-invalid]="form().talkTitle.trim().length === 0 ? 'true' : null"
      />
    </div>

    <div class="field field-checkbox">
      <input
        id="is-gde"
        name="isGDE"
        type="checkbox"
        [checked]="form().isGDE"
        (change)="updateField('isGDE', $any($event.target).checked)"
        aria-label="Sou Google Developer Expert"
      />
      <label for="is-gde">Sou Google Developer Expert (GDE)</label>
    </div>

    <button type="submit" [disabled]="isSubmitDisabled()">
      Enviar proposta
    </button>
  </form>

  <div aria-live="polite" class="feedback">
    @if (submitSuccess()) {
      <p role="alert" class="success">Proposta enviada com sucesso!</p>
    }
    @if (submitError()) {
      <p role="alert" class="error">{{ submitError() }}</p>
    }
  </div>
</main>
