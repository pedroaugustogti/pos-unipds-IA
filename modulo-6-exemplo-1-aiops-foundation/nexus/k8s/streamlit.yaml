apiVersion: v1
kind: Service
metadata:
  name: nexus-ui
  labels:
    app: nexus-ui
spec:
  type: LoadBalancer
  selector:
    app: nexus-ui
  ports:
  - name: http
    port: 8501
    targetPort: 8501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ui
  labels:
    app: nexus-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-ui
  template:
    metadata:
      labels:
        app: nexus-ui
    spec:
      containers:
      - name: streamlit
        image: nexus-bot:v1
        imagePullPolicy: Never
        command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
        ports:
        - containerPort: 8501
        env:
        - name: AWS_ENDPOINT_URL
          value: "http://localstack:4566"
        - name: AWS_ACCESS_KEY_ID
          value: "test"
        - name: AWS_SECRET_ACCESS_KEY
          value: "test"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        - name: NEXUS_IN_DOCKER
          value: "1"
        - name: PYTHONPATH
          value: "/app"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          limits:
            memory: "512Mi"
            cpu: "300m"
          requests:
            memory: "256Mi"
            cpu: "100m"
