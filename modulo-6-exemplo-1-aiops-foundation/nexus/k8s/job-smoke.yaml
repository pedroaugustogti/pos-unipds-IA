apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-bot-smoke
  labels:
    app: nexus-bot
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: nexus-bot
    spec:
      containers:
      - name: nexus-bot
        image: nexus-bot:v1
        imagePullPolicy: Never
        command: ["python", "labs/modulo1_foundation.py"]
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: nexus-secrets
              key: GROQ_API_KEY
        - name: PYTHONPATH
          value: "/app"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NEXUS_IN_DOCKER
          value: "1"
        - name: NEXUS_SSL_INSECURE
          value: "1"
        - name: CREWAI_TRACING_ENABLED
          value: "false"
      restartPolicy: Never
