storage: ./verdaccio/storage
auth:
  htpasswd:
    file: ./verdaccio/htpasswd
    max_users: 1000
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  '@pedroaugusto/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs
  '@*/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs
  '**':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs
server:
  keepAliveTimeout: 60
log:
  type: stdout
  format: pretty
  level: warn
