name: "Agent Task — Guardião Família"
description: Ticket enxuto por papel (refinamento · implementação · QA · review)
title: "[T-XXX-NNN] "
labels:
  - agent:todo
body:
  - type: markdown
    attributes:
      value: |
        Corpo gerado por `board_automation/board/issue_task_body.py`.
        Blocos separados para a orquestração extrair contexto por status/agente.

  - type: input
    id: task_id
    attributes:
      label: Task ID
      placeholder: "T-P3-009"
    validations:
      required: true

  - type: dropdown
    id: agent_role
    attributes:
      label: Creator (implementa)
      options:
        - backend
        - frontend-mobile
        - frontend-web
        - cloud-infra
        - database
        - devops-cicd
    validations:
      required: true

  - type: dropdown
    id: track
    attributes:
      label: Trilha
      options:
        - produto
        - infraestrutura
        - stores
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Repo alvo
      placeholder: guardiao-familia-child
    validations:
      required: true

  - type: input
    id: epic_id
    attributes:
      label: Épico
      placeholder: "E-P3"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Refinamento (todos os agentes)
        Contexto de produto e técnico — sem passos de implementação nem QA.

  - type: textarea
    id: context_summary
    attributes:
      label: Contexto
      description: O que existe hoje e o que muda (2–5 frases factuais)
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: User story
      placeholder: "Como [persona], quero [ação], para [benefício]."

  - type: textarea
    id: state_before
    attributes:
      label: Estado antes
      description: Comportamento/código atual (verificar no repo)

  - type: textarea
    id: state_after
    attributes:
      label: Estado depois (DoD creator)

  - type: textarea
    id: in_scope
    attributes:
      label: Dentro do escopo (um item por linha)
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Fora do escopo (um item por linha)
    validations:
      required: true

  - type: textarea
    id: do_not_touch
    attributes:
      label: Não editar (um path por linha)

  - type: textarea
    id: technical_notes
    attributes:
      label: Notas técnicas

  - type: markdown
    attributes:
      value: |
        ## Implementação (creator)
        Guia de caminho — branch, passos e arquivos sugeridos.

  - type: textarea
    id: suggested_files
    attributes:
      label: Arquivos sugeridos (um path por linha)
    validations:
      required: true

  - type: textarea
    id: implementation_steps
    attributes:
      label: Passos de implementação (um por linha)
      placeholder: |
        git checkout -b feat/t-xxx-...
        Ajustar módulo X
        npm test -- suite

  - type: markdown
    attributes:
      value: |
        ## QA (qa-gate)
        Cenários, critérios de aceite e evidências — não alterar código.

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Critérios de aceite (um por linha, testável PASS/FAIL)
      placeholder: |
        AC-01: Entre 00:00–11:59 header mostra Bom dia
        AC-02: npm test -- childHome.state exit 0
    validations:
      required: true

  - type: dropdown
    id: test_suite
    attributes:
      label: Suite QA
      options:
        - qa-mobile-child-appium
        - qa-mobile-pairing-appium-dual
        - qa-site-hero-playwright
        - qa-api-jest-unit
        - qa-custom
    validations:
      required: true

  - type: textarea
    id: qa_scenarios
    attributes:
      label: Cenários (slugs, um por linha)
      placeholder: |
        greeting-morning-08h
        greeting-afternoon-15h
        greeting-evening-21h

  - type: checkboxes
    id: evidence_required
    attributes:
      label: Evidências obrigatórias
      options:
        - label: Screenshot PNG
        - label: Vídeo MP4
        - label: Report JSON

  - type: dropdown
    id: evidence_screenshot_scope
    attributes:
      label: screenshot_scope
      options:
        - "(nenhum)"
        - child_home_greeting_per_period
        - child_home_single

  - type: dropdown
    id: evidence_video_scope
    attributes:
      label: video_scope
      options:
        - "(nenhum)"
        - appium_flow_pairing_to_home
        - per_period

  - type: dropdown
    id: db_seed_profile
    attributes:
      label: DB seed (mobile)
      options:
        - "(desabilitado)"
        - basic_parent
        - child_home
        - pairing_warm

  - type: textarea
    id: user_flow_map
    attributes:
      label: User flow mobile (se frontend-mobile)
      description: app, emulator, target_screen, target_element, steps — para reprodução QA

  - type: markdown
    attributes:
      value: |
        ## Review (reviewer)
        Analisa apenas diff/PR — não implementa nem roda QA.

  - type: textarea
    id: depends_on
    attributes:
      label: Dependências (task IDs bloqueantes)
      placeholder: "nenhuma"
