# Template para copiar para cada repo de produto (api/parent/child/site/backoffice).
# Caminho sugerido no repo alvo: .github/workflows/guardiao-agent-signals.yml
#
# Segredo necessario: GUARDAO_GATEWAY_TOKEN (PAT com repo + workflow no meta pos-unipds-IA)
# Meta fixo: pedroaugustogti/pos-unipds-IA (ajuste o campo repository: se o fork mudar)

name: Guardião — sinais board (PR/CI)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["*"]
    types: [completed]

jobs:
  signal-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Extract task_id from PR title
        id: task
        shell: bash
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE" =~ \[([A-Z]-[A-Z0-9]+-[0-9]+)\] ]]; then
            echo "task_id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "task_id=" >> "$GITHUB_OUTPUT"
            echo "No [T-XXX] in PR title — skip"
          fi
          if [ "${{ github.event.action }}" = "synchronize" ]; then
            echo "signal=pr_synchronize" >> "$GITHUB_OUTPUT"
          else
            echo "signal=pr_opened" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch pr signal to meta repo
        if: steps.task.outputs.task_id != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GUARDAO_GATEWAY_TOKEN }}
          repository: pedroaugustogti/pos-unipds-IA
          event-type: guardiao-board-signal
          client-payload: |
            {
              "signal": "${{ steps.task.outputs.signal }}",
              "task_id": "${{ steps.task.outputs.task_id }}",
              "pr_url": "${{ github.event.pull_request.html_url }}",
              "pr_title": ${{ toJSON(github.event.pull_request.title) }},
              "branch": "${{ github.event.pull_request.head.ref }}",
              "repo": "${{ github.repository }}",
              "summary": "PR ${{ github.event.action }} from ${{ github.repository }}"
            }

  signal-ci:
    if: >
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion != null) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != null &&
       github.event.workflow_run.name != 'Guardião — sinais board (PR/CI)')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR + task_id
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let pr = null;
            if (context.eventName === 'check_suite') {
              const suite = context.payload.check_suite;
              if (!suite.pull_requests || suite.pull_requests.length === 0) {
                core.setOutput('skip', 'true');
                return;
              }
              const n = suite.pull_requests[0].number;
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: n });
              pr = data;
              core.setOutput('conclusion', suite.conclusion);
            } else {
              const wr = context.payload.workflow_run;
              if (!wr.pull_requests || wr.pull_requests.length === 0) {
                core.setOutput('skip', 'true');
                return;
              }
              const n = wr.pull_requests[0].number;
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: n });
              pr = data;
              core.setOutput('conclusion', wr.conclusion);
            }
            const m = pr.title.match(/\[([A-Z]-[A-Z0-9]+-\d+)\]/);
            if (!m) {
              core.setOutput('skip', 'true');
              return;
            }
            core.setOutput('skip', 'false');
            core.setOutput('task_id', m[1]);
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('pr_title', pr.title);
            core.setOutput('branch', pr.head.ref);

      - name: Dispatch CI green
        if: steps.ctx.outputs.skip == 'false' && steps.ctx.outputs.conclusion == 'success'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GUARDAO_GATEWAY_TOKEN }}
          repository: pedroaugustogti/pos-unipds-IA
          event-type: guardiao-board-signal
          client-payload: |
            {
              "signal": "ci_green",
              "task_id": "${{ steps.ctx.outputs.task_id }}",
              "pr_url": "${{ steps.ctx.outputs.pr_url }}",
              "repo": "${{ github.repository }}",
              "summary": "CI success"
            }

      - name: Dispatch CI red
        if: steps.ctx.outputs.skip == 'false' && steps.ctx.outputs.conclusion == 'failure'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GUARDAO_GATEWAY_TOKEN }}
          repository: pedroaugustogti/pos-unipds-IA
          event-type: guardiao-board-signal
          client-payload: |
            {
              "signal": "ci_red",
              "task_id": "${{ steps.ctx.outputs.task_id }}",
              "pr_url": "${{ steps.ctx.outputs.pr_url }}",
              "bug_kind": "regression",
              "repo": "${{ github.repository }}",
              "summary": "CI failure"
            }
